<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>银河 — Milky Way · Three.js + MediaPipe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030308;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      font-family: sans-serif;
      z-index: 10;
      pointer-events: none;
    }
    .page-title {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-family: sans-serif;
      z-index: 10;
      pointer-events: none;
    }
    .btn-hand {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 8px 16px;
      font-size: 12px;
      color: rgba(255,255,255,0.9);
      background: rgba(100,80,200,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-hand:hover { background: rgba(100,80,200,0.6); }
    .btn-hand:disabled { opacity: 0.5; cursor: not-allowed; }
    #load-err {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #f88;
      font-size: 14px;
      font-family: sans-serif;
      z-index: 20;
      display: none;
      text-align: center;
      max-width: 90%;
    }
  </style>
  <!-- MediaPipe：常规 script 引入，暴露全局变量 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>
<body>
  <script>
    (function() {
      if (new URLSearchParams(location.search).get('embed') === '1') {
        var s = document.createElement('style');
        s.textContent = 'html, body { background: transparent !important; } #canvas-container { background: transparent !important; } #loading-msg, #load-err, .page-title, .hint, .btn-hand { display: none !important; }';
        (document.head || document.documentElement).appendChild(s);
        document.body.style.background = 'transparent';
      }
    })();
  </script>
  <div id="canvas-container"></div>
  <div id="loading-msg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.8);font-size:14px;z-index:5;">银河加载中…</div>
  <div class="page-title">银河 Milky Way</div>
  <div class="hint">漩涡状长条 + 金色/蓝紫/粉橙粒子环 · 鼠标拖拽旋转</div>
  <button type="button" class="btn-hand" id="btn-hand">启用手势控制（需摄像头）</button>
  <div id="load-err"></div>

  <script type="module">
    let THREE, OrbitControls;
    try {
      const threeMod = await import('https://esm.sh/three@0.160.0');
      THREE = threeMod;
      const oc = await import('https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js');
      OrbitControls = oc.OrbitControls;
    } catch (e) {
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('load-err').textContent = 'Three.js 加载失败: ' + (e && e.message ? e.message : String(e));
      document.getElementById('load-err').style.display = 'block';
      throw e;
    }

    const container = document.getElementById('canvas-container');
    const errEl = document.getElementById('load-err');
    const loadingEl = document.getElementById('loading-msg');
    function showErr(msg) {
      if (loadingEl) loadingEl.style.display = 'none';
      if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
    }

    // 避免布局未完成时宽高为 0 导致黑屏
    const width = Math.max(container.clientWidth || 0, window.innerWidth || 800);
    const height = Math.max(container.clientHeight || 0, window.innerHeight || 600);
    if (width < 10 || height < 10) { showErr('容器尺寸异常，请刷新'); throw new Error('container size'); }

    const isEmbed = new URLSearchParams(location.search).get('embed') === '1';
    const scene = new THREE.Scene();
    if (!isEmbed) {
      scene.background = new THREE.Color(0x030308);
      scene.fog = new THREE.FogExp2(0x030308, 0.012);
    }

    const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 2000);
    camera.position.set(0, 8, 28);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: isEmbed, powerPreference: 'high-performance', preserveDrawingBuffer: false });
    if (isEmbed) renderer.setClearColor(0x000000, 0);
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    if (renderer.outputColorSpace !== undefined) renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 12;
    controls.maxDistance = 80;
    controls.maxPolarAngle = Math.PI * 0.6;

    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    // ——— 1. 长长一条横在中央：漩涡状长条银河（蓝紫色），沿 X 轴 ———
    const spiralCount = 16000;
    const spiralPositions = [];
    const stripLength = 48;
    const stripWidthZ = 2.5;
    const stripHeightY = 0.6;
    for (let i = 0; i < spiralCount; i++) {
      const t = i / spiralCount;
      const x = (t - 0.5) * stripLength + (Math.random() - 0.5) * 3;
      const swirl = Math.sin(t * Math.PI * 6) * 0.8 + (Math.random() - 0.5) * 0.4;
      const z = swirl + (Math.random() - 0.5) * stripWidthZ;
      const y = (Math.random() - 0.5) * stripHeightY;
      spiralPositions.push([x, y, z]);
    }
    const spiralGeo = new THREE.SphereGeometry(0.032, 6, 4);
    const spiralMat = new THREE.MeshBasicMaterial({
      color: 0x8877dd,
      transparent: true,
      opacity: 0.98,
    });
    spiralMat.emissive = new THREE.Color(0x6655cc);
    spiralMat.emissiveIntensity = 1.4;
    spiralPositions.forEach((p) => {
      const m = new THREE.Mesh(spiralGeo.clone(), spiralMat.clone());
      m.position.set(p[0], p[1], p[2]);
      galaxyGroup.add(m);
    });

    // ——— 2. 金色小粒子沿中央长条两侧分布，轻微漂移 ———
    const goldenRingCount = 4000;
    const goldenStripLength = 44;
    const goldenOrbitSpeed = 0.018;
    const goldenPositions = [];
    for (let i = 0; i < goldenRingCount; i++) {
      const t = Math.random();
      const x = (t - 0.5) * goldenStripLength + (Math.random() - 0.5) * 4;
      const z = (Math.random() - 0.5) * 4;
      const y = (Math.random() - 0.5) * 1.2;
      goldenPositions.push([x, y, z]);
    }
    const goldenGeo = new THREE.SphereGeometry(0.028, 6, 4);
    const goldenMat = new THREE.MeshBasicMaterial({
      color: 0xffdd88,
      transparent: true,
      opacity: 0.98,
    });
    goldenMat.emissive = new THREE.Color(0xffcc66);
    goldenMat.emissiveIntensity = 1.8;
    const goldenMeshes = [];
    goldenPositions.forEach((p, i) => {
      const m = new THREE.Mesh(goldenGeo.clone(), goldenMat.clone());
      m.position.set(p[0], p[1], p[2]);
      m.userData = { baseX: p[0], baseZ: p[2], phase: Math.random() * Math.PI * 2 };
      galaxyGroup.add(m);
      goldenMeshes.push(m);
    });

    // ——— 3. 金色长条周围：蓝紫色小粒子一层一层密集排开（绕长条截面成多层环） ———
    const bluePurpleColor = 0x7766dd;
    const layerRadii = [1.2, 2.0, 2.8, 3.6, 4.4, 5.2, 6.0, 6.8, 7.6];
    const particlesPerLayerRing = 58;
    const layerRingsAlongX = 130;
    const bluePurpleMeshes = [];
    for (let L = 0; L < layerRadii.length; L++) {
      const r = layerRadii[L];
      for (let xi = 0; xi < layerRingsAlongX; xi++) {
        const x = (xi / (layerRingsAlongX - 1) - 0.5) * 46 + (Math.random() - 0.5) * 0.5;
        for (let k = 0; k < particlesPerLayerRing; k++) {
          const angle = (k / particlesPerLayerRing) * Math.PI * 2 + Math.random() * 0.15;
          const y = r * Math.cos(angle) * 0.4 + (Math.random() - 0.5) * 0.2;
          const z = r * Math.sin(angle) + (Math.random() - 0.5) * 0.25;
          const geo = new THREE.SphereGeometry(0.018 + Math.random() * 0.01, 6, 4);
          const mat = new THREE.MeshBasicMaterial({
            color: bluePurpleColor,
            transparent: true,
            opacity: 0.94,
          });
          mat.emissive = new THREE.Color(0x5544cc);
          mat.emissiveIntensity = 1.5;
          const m = new THREE.Mesh(geo, mat);
          m.position.set(x, y, z);
          galaxyGroup.add(m);
          bluePurpleMeshes.push(m);
        }
      }
    }

    // ——— 4. 粉橙色粒子：横带在中央长条上下 ———
    const pinkOrangeBands = 5;
    const pinkColor = 0xff88aa;
    const orangeColor = 0xffaa77;
    const pinkOrangeMeshes = [];
    for (let band = 0; band < pinkOrangeBands; band++) {
      const color = band % 2 === 0 ? pinkColor : orangeColor;
      const zOff = (band / (pinkOrangeBands - 1) - 0.5) * 4;
      for (let i = 0; i < bandParticles; i++) {
        const t = Math.random();
        const x = (t - 0.5) * 40 + (Math.random() - 0.5) * 2.5;
        const z = zOff + (Math.random() - 0.5) * 1.5;
        const y = (Math.random() - 0.5) * 0.6;
        const geo = new THREE.SphereGeometry(0.022 + Math.random() * 0.015, 6, 4);
        const mat = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: 0.96,
        });
        mat.emissive = new THREE.Color(color);
        mat.emissiveIntensity = 1.6;
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        galaxyGroup.add(m);
        pinkOrangeMeshes.push(m);
      }
    }

    // 银河横条在场景中央，不再倾斜（正面看就是一条横带）
    galaxyGroup.rotation.x = 0;

    let time = 0;
    let firstFrame = true;
    function animate() {
      requestAnimationFrame(animate);
      if (firstFrame && loadingEl) { firstFrame = false; loadingEl.style.display = 'none'; }
      time += 0.016;
      controls.update();

      // 金色粒子沿长条轻微漂移
      goldenMeshes.forEach((m) => {
        const { baseX, baseZ, phase } = m.userData;
        m.position.x = baseX + Math.sin(time * goldenOrbitSpeed * 40 + phase) * 0.8;
        m.position.z = baseZ + Math.cos(time * 0.5 + phase * 1.3) * 0.5;
      });

      // 银河缓慢自转
      galaxyGroup.rotation.y = time * 0.012;

      if (window.__handLandmarks) updateCameraFromHand();

      renderer.render(scene, camera);
    }

    function updateCameraFromHand() {
      const lm = window.__handLandmarks;
      if (!lm || !lm[9]) return;
      const idx = lm[9];
      const tx = (idx.x - 0.5) * 24;
      const tz = 28 + (idx.z || 0) * 8;
      camera.position.x += (tx - camera.position.x) * 0.03;
      camera.position.z += (tz - camera.position.z) * 0.03;
      camera.lookAt(0, 0, 0);
    }

    // MediaPipe：不自动请求摄像头，避免一打开就弹权限/报错；用户点击按钮后再请求
    (function initMediaPipe() {
      try {
        if (typeof window.Hands === 'undefined' || typeof window.Camera === 'undefined') return;
        const video = document.createElement('video');
        video.setAttribute('playsinline', '');
        video.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;';
        document.body.appendChild(video);
        const hands = new window.Hands({
          locateFile: (file) => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/' + file,
        });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.4 });
        hands.onResults((results) => {
          window.__handLandmarks = (results.multiHandLandmarks && results.multiHandLandmarks[0]) || null;
        });
        const cam = new window.Camera(video, {
          onFrame: async () => { await hands.send({ image: video }); },
          width: 640,
          height: 480,
          facingMode: 'user',
        });
        const btn = document.getElementById('btn-hand');
        if (!btn) return;
        btn.onclick = async function () {
          btn.disabled = true;
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(function (t) { t.stop(); });
            cam.start();
            btn.textContent = '手势控制已开启';
          } catch (e) {
            btn.disabled = false;
            btn.textContent = '摄像头未授权，仅用鼠标操作';
          }
        };
      } catch (e) {
        console.warn('MediaPipe init skip:', e);
        const btn = document.getElementById('btn-hand');
        if (btn) btn.style.display = 'none';
      }
    })();

    window.addEventListener('resize', () => {
      const w = Math.max(container.clientWidth || 0, window.innerWidth);
      const h = Math.max(container.clientHeight || 0, window.innerHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    animate();
  </script>
</body>
</html>
